name: fire_safety_inspector
description: A mobile solution for fire safety inspectors
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  flutter_bloc: ^8.1.4
  google_maps_flutter: ^2.5.0
  location: ^5.0.0
  geocoding: ^2.1.0
  geolocator: ^9.0.0
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.3.0
  connectivity_plus: ^4.0.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  camera: ^0.10.5
  image_picker: ^1.0.0
  photo_view: ^0.14.0
  pdf: ^3.10.0
  printing: ^5.11.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  flutter_local_notifications: ^15.1.0
  table_calendar: ^3.0.9
  math_expressions: ^2.4.0
  intl: ^0.18.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  firebase_core: ^2.25.4
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.12.1
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  share_plus: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.2
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/law_data.json 